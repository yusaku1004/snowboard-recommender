name: 楽天の価格・画像を更新

on:
  schedule:
    # 毎週月曜 4:00（日本時間）
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rakuten
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 楽天APIからデータを取得
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: node scripts/update_rakuten.ts --discover

      # 取得結果でテストとビルドが通ることを確認してからコミットする
      - run: npm test
      - run: npm run build

      - name: 変更があればコミット
        run: |
          git add src/data/rakuten_offers.json src/data/boards_carryover.json reports/rakuten-update.md
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "楽天の価格・画像を更新（$(date -u +%Y-%m-%d)）"
          git push
